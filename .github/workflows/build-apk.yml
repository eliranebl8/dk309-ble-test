name: Build DK309 BLE Diagnostic APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'DK309_BLE_SOURCE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q DK309_BLE_SOURCE.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DK309-BLE-Diagnostic-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
